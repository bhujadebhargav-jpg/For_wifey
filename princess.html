<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Wifey 💖</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #ffd6e0, #fff0f5);
      overflow: hidden;
      text-align: center;
      color: #5a2a3a;
    }h1 {
  margin-top: 20vh;
  font-size: 2.2rem;
  padding: 0 20px;
  min-height: 3em;
}

.cursor {
  display: inline-block;
  width: 2px;
  background: #5a2a3a;
  margin-left: 5px;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 50%, 100% { opacity: 1; }
  25%, 75% { opacity: 0; }
}

.emoji {
  position: absolute;
  font-size: 2rem;
  animation: float 10s linear infinite;
  opacity: 0.8;
}

@keyframes float {
  0% { transform: translateY(100vh); }
  100% { transform: translateY(-10vh); }
}

button {
  margin-top: 30px;
  padding: 12px 24px;
  border: none;
  border-radius: 25px;
  background: #ff8fb1;
  color: white;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

button:hover {
  background: #ff6f9a;
}

#hiddenMessage {
  margin-top: 20px;
  font-size: 1.6rem;
  display: none;
  animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

  </style>
</head>
<body>  <h1 id="typewriter"></h1>
  <button onclick="revealMessage()">Open this when you need a hug 🤗</button>
  <div id="hiddenMessage">I love you my wifey 💖</div>  <script>
    const text = '"You will get all this IRL one day by me, my wifey" 💐🧸';
    let i = 0;

    function typeWriter() {
      if (i < text.length) {
        document.getElementById("typewriter").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 50);
      } else {
        document.getElementById("typewriter").innerHTML += '<span class="cursor"></span>';
      }
    }

    typeWriter();

    function revealMessage() {
      document.getElementById("hiddenMessage").style.display = 'block';
    }

    const emojis = ['🧸','🌸','🌷','💖','🌹','💕'];

    function createEmoji() {
      const emoji = document.createElement('div');
      emoji.classList.add('emoji');
      emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * 100 + 'vw';
      emoji.style.animationDuration = (5 + Math.random() * 5) + 's';
      document.body.appendChild(emoji);

      setTimeout(() => {
        emoji.remove();
      }, 10000);
    }

    setInterval(createEmoji, 300);
  </script></body>
</html>
